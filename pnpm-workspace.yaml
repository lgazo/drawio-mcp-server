onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

packages:
  - 'packages/*'

catalog:
  typescript: "5.9.3"
  "@biomejs/biome": "2.4.13"
  "node-forge": "1.4.0"

overrides:
  "tmp@<0.2.6": ">=0.2.6"
  "uuid@<11.1.1": ">=11.1.1"
  "shell-quote@<1.12.0": ">=1.12.0"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "adm-zip@<0.6.1": ">=0.6.1"
  "handlebars@<4.7.10": ">=4.7.10"
  "proxy-addr@<2.0.8": ">=2.0.8"
  "ip-address@<10.7.1": ">=10.7.1"
  "fast-uri@<3.1.8": ">=3.1.8"
  "brace-expansion@>=1 <1.1.21": "1.1.21"
  "brace-expansion@>=2 <2.1.7": "2.1.7"
  "brace-expansion@>=5 <5.0.12": "5.0.12"

# Audit findings with no patched release available yet.
# Remove each GHSA once its advisory gets a fixed version.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0, high, no fix released
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, high, no fix released
    - GHSA-hp3w-g68c-fv3c # sprintf-js <=1.1.3, moderate, no fix released

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Draw.io</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #editor { width: 100%; height: 100%; border: 0; display: block; }
  #fallback {
    display: none;
    position: absolute; inset: 0;
    padding: 2em; font: 14px/1.5 system-ui, sans-serif; color: #333;
  }
  #fallback.visible { display: block; }
  code { background: #f4f4f4; padding: 2px 4px; border-radius: 3px; }
</style>
</head>
<body>
<iframe id="editor" src="__EDITOR_URL__"></iframe>
<div id="fallback">
  <p><strong>Draw.io editor unreachable.</strong></p>
  <p>Could not load <code>__EDITOR_URL__</code>.</p>
  <p>Start the server with <code>--editor</code> and make sure this MCP host
  can reach the machine running drawio-mcp-server (localhost). If you are on
  a remote/browser-only host, the local editor cannot be displayed.</p>
</div>
<script>/*__APP_CLIENT__*/</script>
<script>/*__EMBED_PROTOCOL__*/</script>
<script>
(function () {
  "use strict";
  var editor = document.getElementById("editor");
  var fallback = document.getElementById("fallback");
  var AppCtor = globalThis.McpAppsApp;
  var embed = globalThis.DrawioEmbedProtocol;
  var lastXml = null;
  var editorReady = false;
  var initTimer = setTimeout(showFallback, 8000);

  function showFallback() {
    if (!editorReady) {
      fallback.classList.add("visible");
      editor.style.display = "none";
    }
  }

  if (AppCtor) {
    var app = new AppCtor({ name: "drawio-mcp-server", version: "1" });
    app.connect();
    app.ontoolresult = function (result) {
      var texts = (result && result.content) || [];
      for (var i = 0; i < texts.length; i++) {
        var item = texts[i];
        if (item.type === "text" && item.text &&
            (item.text.indexOf("<mxfile") !== -1 ||
             item.text.indexOf("<mxGraphModel") !== -1)) {
          lastXml = item.text;
          sendLoad();
          return;
        }
      }
    };
  }

  // draw.io embed mode (proto=json): the editor posts lifecycle events to
  // its parent window (this shell) as JSON strings; every action sent to
  // the editor must likewise be a JSON string (see embed-protocol.ts for
  // why). We reply with a load action once the editor reports init.
  window.addEventListener("message", function (event) {
    if (!embed) return;
    var msg = embed.parseEditorMessage(event.data);
    if (!msg) return;
    if (msg.event === "init") {
      editorReady = true;
      clearTimeout(initTimer);
      sendLoad();
    } else if (msg.event === "configure") {
      editor.contentWindow.postMessage(
        embed.encodeEditorAction("configure", { config: {} }),
        "*"
      );
    } else if (msg.event === "save" || msg.event === "export") {
      // Live sync runs through mcp-plugin.js inside the framed editor
      // (WebSocket bridge); saves need no handling in the shell.
    }
  });

  // Always sends a load once the editor is ready: with lastXml when a tool
  // result already delivered a diagram, otherwise as a bare load. The editor
  // defaults a bare load to its empty diagram and — crucially for
  // list-documents — materializes an EmbedFile via setCurrentFile in its
  // initializeEmbedMode handler, which is what mcp-plugin.js needs for a
  // non-null ui.getCurrentFile() in embed mode.
  function sendLoad() {
    if (!editorReady || !editor.contentWindow || !embed) return;
    var fields = { autosave: 1 };
    if (lastXml !== null) fields.xml = lastXml;
    editor.contentWindow.postMessage(
      embed.encodeEditorAction("load", fields),
      "*"
    );
  }
})();
</script>
</body>
</html>

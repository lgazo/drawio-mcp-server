name: Claude Plugin CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-claude-plugin/**'
      - '.claude-plugin/**'
      - '.github/workflows/claude-plugin-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-claude-plugin/**'
      - '.claude-plugin/**'
      - '.github/workflows/claude-plugin-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        # Non-blocking: regular CI must not fail on new advisories.
        # Blocking audits live in the release pipelines and the scheduled
        # security scan (.github/workflows/security-scan.yml).
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
      - name: Lint plugin package
        run: pnpm --filter drawio-mcp-claude-plugin lint
      - name: Run plugin tests
        run: pnpm --filter drawio-mcp-claude-plugin test

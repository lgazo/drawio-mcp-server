name: Extension CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-extension/**'
      - 'packages/drawio-mcp-plugin/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-extension/**'
      - 'packages/drawio-mcp-plugin/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        # Non-blocking: regular CI must not fail on new advisories.
        # Blocking audits live in the release pipelines and the scheduled
        # security scan (.github/workflows/security-scan.yml).
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Build compat
        run: pnpm --filter drawio-mcp-compat run build

      - name: Build plugin
        run: pnpm run build
        working-directory: packages/drawio-mcp-plugin

      - name: Build extension (chrome)
        run: pnpm run build
        working-directory: packages/drawio-mcp-extension

      - name: Build extension (firefox)
        run: pnpm run build:firefox
        working-directory: packages/drawio-mcp-extension

      - name: Check translations
        run: node scripts/translate.mjs locales --check

name: Publish Extension

# Reusable publish job invoked by release.yml after the extension tag and
# Release exist. Uploads the CWS zip as a DRAFT only (no auto-publish);
# AMO submission stays manual from the zips on the Release page (v1).
on:
  workflow_call:
    inputs:
      version:
        description: "Released version (X.Y.Z)"
        type: string
        required: true
      ref:
        description: "Tag/ref to build"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (X.Y.Z)"
        type: string
        required: true
      ref:
        description: "Tag/ref to build"
        type: string
        required: true

permissions:
  contents: write # attach zips to the GitHub Release

concurrency:
  group: extension-publish-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies (blocking on release)
        run: pnpm audit --audit-level=moderate

      - name: Build compat
        run: pnpm --filter drawio-mcp-compat run build

      - name: Build plugin
        run: pnpm --filter drawio-mcp-plugin run build

      - name: Build extension (chrome)
        run: pnpm run build
        working-directory: packages/drawio-mcp-extension

      - name: Package extension (chrome)
        run: pnpm run zip
        working-directory: packages/drawio-mcp-extension

      - name: Package extension (firefox)
        run: pnpm run zip:firefox
        working-directory: packages/drawio-mcp-extension

      - name: Package extension source (zip of the tagged commit)
        run: |
          git archive --format=zip \
            -o "packages/drawio-mcp-extension/.output/drawio-mcp-extension-${VERSION}-source.zip" \
            HEAD
        env:
          VERSION: ${{ inputs.version }}

      - name: Attach zips to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # One Release item per release: when the server released too, the
          # extension assets live on the shared v$VERSION Release; an
          # extension-only release uses the extension's own item.
          RELEASE="v$VERSION"
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            RELEASE="drawio-mcp-extension-v$VERSION"
          fi
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" \
              "packages/drawio-mcp-extension/.output/drawio-mcp-extension-${VERSION}-chrome.zip" \
              "packages/drawio-mcp-extension/.output/drawio-mcp-extension-${VERSION}-firefox.zip" \
              "packages/drawio-mcp-extension/.output/drawio-mcp-extension-${VERSION}-source.zip" \
              --clobber
          else
            echo "Release $RELEASE not found; zips stay as build outputs:"
            ls -la packages/drawio-mcp-extension/.output
          fi

      - name: Upload CWS draft (skipped without store credentials)
        id: cws
        continue-on-error: true
        env:
          # chrome-webstore-upload-cli 4.x reads these exact env names; the
          # old --client-id/--client-secret/--refresh-token flags were removed.
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          VERSION: ${{ inputs.version }}
        working-directory: packages/drawio-mcp-extension
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$EXTENSION_ID" ] || [ -z "$PUBLISHER_ID" ]; then
            echo "CWS_* secrets not configured; skipping draft upload (manual submission from the Release page zips)."
            exit 0
          fi
          pnpm exec chrome-webstore-upload upload --source ".output/drawio-mcp-extension-${VERSION}-chrome.zip"

      - name: Report CWS upload result
        if: ${{ always() && steps.cws.outcome == 'failure' }}
        run: echo "CWS draft upload failed (non-fatal); submit manually from the Release page zips."

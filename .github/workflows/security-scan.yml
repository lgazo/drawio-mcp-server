name: Security Scan

# Regular (scheduled) security scan. Regular CI pipelines only run a
# non-blocking audit; this workflow is the blocking, always-on watch:
#   - audit:      fails when new advisories appear at moderate or above
#   - overrides:  fails when an audit override in pnpm-workspace.yaml
#                 is no longer needed
#   - auto-fix:   tries `pnpm audit --fix`, fully builds and tests, and
#                 opens a PR with the fix when everything passes

on:
  schedule:
    - cron: "31 5 * * 1" # Mondays 05:31 UTC
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  check-overrides:
    name: Check audit overrides still needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
      - name: Check overrides
        run: ./scripts/check-audit-overrides.sh

  auto-fix:
    name: Auto-fix vulnerabilities and test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Try to fix vulnerabilities
        # Not every advisory has a fixable version; a non-zero exit here
        # is expected and handled by the change detection below.
        run: pnpm audit --fix --audit-level=moderate || true

      - name: Detect lockfile changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reinstall from updated lockfile
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install

      - name: Install Playwright browser
        if: steps.changes.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/drawio-mcp-server

      - name: Prefetch draw.io assets
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run prefetch-assets
        working-directory: packages/drawio-mcp-server

      - name: Build all packages
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build

      - name: Run all tests
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      - name: Create pull request with the fix
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/audit-auto-fix
          delete-branch: true
          title: "security: auto-fix dependency vulnerabilities"
          body: |
            Automated pull request from the scheduled Security Scan workflow
            (`.github/workflows/security-scan.yml`).

            - Generated by `pnpm audit --fix`
            - All packages built and full test suite run before opening this PR
          labels: security
          commit-message: "fix(security): auto-fix dependency vulnerabilities found by scheduled scan"
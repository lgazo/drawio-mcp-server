name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-server/**'
      - '.github/workflows/server-ci.yml'
      - 'README.md'
      - 'TOOLS.md'
      - 'CONFIG.md'
      - 'TROUBLESHOOTING.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/drawio-mcp-server/**'
      - '.github/workflows/server-ci.yml'
      - 'README.md'
      - 'TOOLS.md'
      - 'CONFIG.md'
      - 'TROUBLESHOOTING.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        # Non-blocking: regular CI must not fail on new advisories.
        # Blocking audits live in the release pipelines and the scheduled
        # security scan (.github/workflows/security-scan.yml).
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache draw.io assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/drawio-mcp-server
          key: drawio-assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/drawio-mcp-server

      - name: Build compat
        run: pnpm --filter drawio-mcp-compat run build

      - name: Build plugin
        run: pnpm --filter drawio-mcp-plugin run build

      - name: Build dev proxy
        run: pnpm --filter drawio-mcp-dev-proxy run build

      - name: Build server for asset prefetch
        run: pnpm --filter drawio-mcp-server run build

      - name: Prefetch draw.io assets
        run: pnpm run prefetch-assets
        working-directory: packages/drawio-mcp-server

      - name: Check types
        run: pnpm --filter drawio-mcp-server run lint

      - name: Run linter
        run: |
          pnpm run lint
          pnpm run format:check
        working-directory: packages/drawio-mcp-server

      - name: Run tests
        run: pnpm test
        working-directory: packages/drawio-mcp-server

      - name: Check translations
        run: |
          node scripts/translate.mjs locales --check
          node scripts/translate.mjs docs --check
